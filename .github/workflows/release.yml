name: Release

# Builds the Windows installer when a version tag is pushed (git tag v0.3.1 && git push origin v0.3.1) and attaches it to a GitHub release.
# Installed copies of InvoiceOn look at the latest release for a newer version (see checkForUpdates in electron/main.ts).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The installer's version comes from package.json, so it must match the tag.
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Build and publish the installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
